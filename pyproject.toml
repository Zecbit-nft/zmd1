[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zmd1"
version = "1.0.0"
description = "Reference implementation of ZMD-1, a metadata standard for Zcash Shielded Assets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["zcash", "zsa", "nft", "metadata", "zip-227"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema>=4.0"]
dev = ["jsonschema>=4.0", "pytest>=7", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
zmd1 = "zmd1.cli:main"

[project.urls]
Homepage = "https://zecbit.io"
Source = "https://github.com/Zecbit-nft/zmd1"
Specification = "https://github.com/Zecbit-nft/zmd1/blob/main/SPEC.md"

[tool.hatch.build.targets.wheel]
packages = ["src/zmd1"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/zmd1"]

[[tool.mypy.overrides]]
module = ["jsonschema"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
